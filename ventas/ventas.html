<!-- Calculadora de Comisiones -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <!-- utilitarios.js va antes que ventas.js: ventas.js usa sus funciones -->
    <script src="utilitarios.js"></script>
</head>

<body>

    <div class="contenedor">
        <header>
            <p class="etiqueta">HERRAMIENTA DE VENTAS</p>
            <h1>Calculadora de Comisiones</h1>
            <p class="descripcion">Calcula el valor extra ganado por ventas superiores a 5 unidades.</p>
        </header>

        <!-- Cada id debe coincidir exactamente con lo que lee ventas.js

             AGREGANDO CAMPO NUEVO (ejemplo: Meses trabajados / Bono) — orden que seguimos:
             PASO 1: aquí abajo, el label + input del campo (ej. txtMeses)
             PASO 2: en la sección de resultados, el <strong> donde se muestra (ej. spBono)
             PASO 3: en ventas.js función calcular() — leer el valor con recuperarFloat/recuperarEntero
             PASO 4: en ventas.js — agregar el campo a la validación (Number.isFinite)
             PASO 5: en ventas.js — calcular lo que corresponda con ese valor
             PASO 6: en ventas.js — usar el resultado donde corresponda (ej. sumarlo al total)
             PASO 7: en ventas.js — mostrarlo en pantalla con mostrarEnSpan -->
        <div class="campo">
            <label for="txtSueldoBase">Salario base</label>
            <input type="number" id="txtSueldoBase" min="0" step="0.01" inputmode="decimal" placeholder="Ej.: 500.00">
        </div>

        <div class="campo">
            <label for="txtVentas">Número de ventas</label>
            <input type="number" id="txtVentas" min="0" step="1" inputmode="numeric" placeholder="Ej.: 8">
        </div>

        <div class="campo">
            <label for="txtPrecio">Precio por producto</label>
            <input type="number" id="txtPrecio" min="0" step="0.01" inputmode="decimal" placeholder="Ej.: 25.50">
        </div>

        <div class="campo">
            <label for="txtMeses">Meses trabajados</label>
            <input type="number" id="txtMeses" min="0" step="1" inputmode="numeric" placeholder="Ej.: 6">
        </div>

        <button type="button" onclick="calcular()">Calcular Comisión</button>

        <!-- ventas.js escribe aquí el mensaje de error, si hay -->
        <p class="mensaje" role="alert" aria-live="polite"></p>

        <section class="resultados" aria-live="polite">
            <h2>Resultados</h2>
            <p><span>Salario base</span><strong id="spSueldoBase">—</strong></p>
            <p><span>Comisión</span><strong id="spComision">—</strong></p>
            <p class="total"><span>Total a recibir</span><strong id="spTotal">—</strong></p>
            <p class="total"><span>Total Bono</span><strong id="spBono">—</strong></p>
        </section>

        <script src="ventas.js"></script>
    </div>

</body>

</html>
